<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3498db" />
  
  <!-- Graph nodes -->
  <circle cx="20" cy="20" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <circle cx="44" cy="20" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <circle cx="20" cy="44" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <circle cx="44" cy="44" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <circle cx="32" cy="32" r="5" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  
  <!-- Graph edges -->
  <line x1="20" y1="20" x2="44" y2="20" stroke="#ffffff" stroke-width="2" />
  <line x1="44" y1="20" x2="44" y2="44" stroke="#ffffff" stroke-width="2" />
